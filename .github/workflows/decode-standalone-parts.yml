name: decode-standalone-parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/standalone-parts/_hex/**'
      - 'docs/standalone-parts/*.hex'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode hex payloads to txt
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re
          outdir = Path('docs/standalone-parts')
          for f in sorted(outdir.glob('*.hex')):
              part = f.stem
              raw = bytes.fromhex(f.read_text().strip())
              out = outdir / f'{part}.txt'
              out.write_bytes(raw)
              print('full', part, 'bytes', len(raw))
          root = Path('docs/standalone-parts/_hex')
          if root.exists():
              parts = {}
              for f in sorted(root.glob('*.hex.*')):
                  m = re.match(r'(\d+)\.hex\.(\d+)$', f.name)
                  if not m:
                      continue
                  part, n = m.group(1), int(m.group(2))
                  parts.setdefault(part, []).append((n, f.read_text().strip()))
              for part, items in sorted(parts.items()):
                  items.sort()
                  hexdata = ''.join(c for _, c in items)
                  raw = bytes.fromhex(hexdata)
                  out = outdir / f'{part}.txt'
                  out.write_bytes(raw)
                  print('chunked', part, 'bytes', len(raw), 'md5', __import__('hashlib').md5(raw).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/standalone-parts/*.txt
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "Decode standalone-parts hex payloads to txt"
            git push
          fi
