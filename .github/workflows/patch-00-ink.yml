name: patch-00-ink
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/standalone-parts/_hex/.trigger-ink'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Same-length patch part 00 ink/muted
        run: |
          python3 << 'EOF'
          from pathlib import Path
          p = Path('docs/standalone-parts/00.txt')
          t = p.read_text(encoding='utf-8')
          n = t.replace('--ink:#ebe4d6', '--ink:#f5f0e6').replace('--muted:#a89f8e', '--muted:#c4bba8')
          if n == t:
              print('already patched or patterns missing')
          else:
              assert len(n.encode()) == len(t.encode())
              p.write_text(n, encoding='utf-8')
              print('patched 00')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/standalone-parts/00.txt
          git diff --cached --quiet && echo no changes && exit 0
          git commit -m "Reader UX: brighter ink/muted in part 00"
          git push
