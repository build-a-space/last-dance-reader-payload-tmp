name: fix-standalone-parts
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix part 13 two-char corruption and decode hex parts
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          # Fix 13.txt in place (y->Y at 8739, z->Z at 9077)
          p = Path('docs/standalone-parts/13.txt')
          c = p.read_text()
          assert len(c) == 14000, len(c)
          c = c[:8739] + 'Y' + c[8740:]
          c = c[:9077] + 'Z' + c[9078:]
          p.write_text(c)
          print('13 fixed', len(c), c[8739], c[9077])
          # Decode any *.txt.hex sidecars for 14-16
          for n in ('14', '15', '16'):
              hx = Path(f'docs/standalone-parts/{n}.txt.hex')
              if hx.exists():
                  b = bytes.fromhex(hx.read_text().strip())
                  Path(f'docs/standalone-parts/{n}.txt').write_bytes(b)
                  hx.unlink()
                  print(n, 'decoded', len(b))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/standalone-parts/
          git status
          git diff --cached --quiet && echo No changes && exit 0
          git commit -m "Fix 13.txt and add decoded 14-16.txt standalone reader parts"
          git push
