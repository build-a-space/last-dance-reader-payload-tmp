<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last Dance Before the Altar</title>
  <style>
    body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#0f0e0c; color:#f5f0e6; font-family:Georgia,serif; }
    .box { text-align:center; padding:2rem; }
    .spinner { width:1.5rem; height:1.5rem; border:2px solid rgba(232,220,196,.2); border-top-color:#c9a46c; border-radius:50%; margin:0 auto 1rem; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color:#f0b4b4; max-width:28rem; line-height:1.5; }
  </style>
</head>
<body>
  <div class="box" id="status">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading Last Dance…</p>
  </div>
  <script>
  (async () => {
    // raw GitHub (jsDelivr can lag on @main after fixes)
    const BASE = 'https://raw.githubusercontent.com/build-a-space/last-dance-reader-payload-tmp/main/docs/standalone-parts/';
    const COUNT = 18;
    const status = document.getElementById('status');
    try {
      const parts = [];
      for (let i = 0; i < COUNT; i++) {
        status.querySelector('p').textContent = 'Loading Last Dance… ' + (i + 1) + '/' + COUNT;
        const r = await fetch(BASE + String(i).padStart(2, '0') + '.txt?v=3', { cache: 'no-store' });
        if (!r.ok) throw new Error('Missing part ' + i + ' (' + r.status + ')');
        parts.push(await r.text());
      }
      const html = parts.join('');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      status.innerHTML = '<p class="err">Could not load the book from GitHub.<br>' + (e && e.message ? e.message : e) + '<br><br>Download the standalone HTML from Drive and open it locally.</p>';
    }
  })();
  </script>
</body>
</html>
